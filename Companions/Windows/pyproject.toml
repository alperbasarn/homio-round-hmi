[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qnob-companion"
version = "0.1.0"
description = "Companion app for the Qnob smart-knob device — discovery, configuration, and control over TCP/BLE."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alper Basaran" }]

dependencies = [
    "bleak>=0.22",
    "zeroconf>=0.131",
    "PySide6>=6.7",
    "qasync>=0.27",
    "keyring>=24",
    "platformdirs>=4",
    "pydantic>=2",
    # Salvaged-from-legacy (PC-side audio + media controls):
    "pywin32>=305; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
qnob-companion = "qnob_companion.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "RET", "SIM"]
ignore = ["E501"]  # line too long handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
# Bleak / zeroconf / qasync / pycaw lack stubs — silence per-module.
[[tool.mypy.overrides]]
module = ["bleak.*", "zeroconf.*", "qasync.*", "pycaw.*", "comtypes.*", "win32gui", "win32api", "win32con"]
ignore_missing_imports = true
