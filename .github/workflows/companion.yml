name: Companion CI

on:
  push:
    branches: [main, connectivity-refactor]
    paths:
      - 'Companions/Windows/**'
      - '.github/workflows/companion.yml'
  pull_request:
    paths:
      - 'Companions/Windows/**'
      - '.github/workflows/companion.yml'

defaults:
  run:
    working-directory: Companions/Windows

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest
        run: pytest
