name: Release OTA

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ota-pages
  cancel-in-progress: false

env:
  OTA_BASE_URL: https://alperbasarn.github.io/homio-round-hmi/ota

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        variant:
          - esp32s3_lcd128
          - esp32s3_amoled175
          - esp32c6_amoled143
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build variant
        shell: bash
        env:
          ESP_IDF_EXPORT: /opt/esp/idf/export.sh
        run: |
          set -euo pipefail
          export PROJECT_VER="${GITHUB_REF_NAME#release-}"
          bash ./build-variant.sh "${{ matrix.variant }}"

      - name: Upload variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.variant }}
          path: Binaries/${{ matrix.variant }}
          if-no-files-found: error

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: Binaries
          merge-multiple: true

      - name: Generate OTA site payload
        shell: bash
        run: |
          set -euo pipefail
          python3 ./scripts/generate_ota_site.py \
            --publish-root ./Binaries \
            --site-root ./site \
            --release-tag "${GITHUB_REF_NAME}" \
            --base-url "${OTA_BASE_URL}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4